<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grade Book</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Grade Book</h1>
    <form id="gradeForm">
        <label>First Name:
            <input type="text" id="firstName">
            <span class="error" id="firstNameError"></span>
        </label>
        <br>
        <label>Last Name:
            <input type="text" id="lastName">
            <span class="error" id="lastNameError"></span>
        </label>
        <br>
        <label>Mark 1:
            <input type="number" id="mark1">
            <span class="error" id="mark1Error"></span>
        </label>
        <br>
        <label>Mark 2:
            <input type="number" id="mark2">
            <span class="error" id="mark2Error"></span>
        </label>
        <br>
        <label>Mark 3:
            <input type="number" id="mark3">
            <span class="error" id="mark3Error"></span>
        </label>
        <br>
        <button type="button" onclick="validateTxt()">Validate</button>
        <br>
        <button type="button" onclick="printResult()">Print Result</button>
    </form>
    <p id="result"></p>
    <script src="script.js" ></script>
</body>
</html>
